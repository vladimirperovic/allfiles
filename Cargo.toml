[package]
name = "allfiles"
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Private portable file and document catalog"
license = "MIT"
repository = "https://github.com/vladimirperovic/allfiles"

[dependencies]
anyhow = "1"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-std", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
flate2 = "1"
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
adiantum = "=0.2.0"
aes = { version = "0.9", features = ["zeroize"] }
chacha20 = { version = "0.10", features = ["xchacha", "zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
same-file = "1"
dunce = "1"
walkdir = "2"
quick-xml = "0.38"
csv = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
pdf-extract = "=0.12.1"
rpassword = "7"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
exclude = ["experiments/rust-search"]
