name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: .exe
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build standalone binary
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=${GITHUB_SHA::12}" -o "dist/allfiles-${GOOS}-${GOARCH}${{ matrix.extension }}" .
      - name: Package with checksums
        shell: bash
        run: |
          cp README.md dist/README.md
          cp THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt
          cd dist
          sha256sum "allfiles-${GOOS}-${GOARCH}${{ matrix.extension }}" > SHA256SUMS
          tar -czf "allfiles-${GOOS}-${GOARCH}.tar.gz" "allfiles-${GOOS}-${GOARCH}${{ matrix.extension }}" README.md THIRD_PARTY_NOTICES.txt SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: allfiles-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
