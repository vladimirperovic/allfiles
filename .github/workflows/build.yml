name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Save build archives in GitHub Actions storage
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: allfiles-linux-amd64
            extension: ''
          - os: ubuntu-24.04-arm
            name: allfiles-linux-arm64
            extension: ''
          - os: macos-15
            name: allfiles-darwin-arm64
            extension: ''
          - os: macos-15-intel
            name: allfiles-darwin-amd64
            extension: ''
          - os: windows-latest
            name: allfiles-windows-amd64.exe
            extension: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1 fmt --check
      - run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 build --locked --release
      - name: HTTP and MCP integration
        run: python scripts/smoke.py target/release/allfiles${{ matrix.extension }}
      - name: Package binary and notices
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.name }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          cp "target/release/allfiles$EXTENSION" "dist/$BINARY_NAME"
          cp README.md README.en.md THIRD_PARTY_NOTICES.txt dist/
          python -c 'import hashlib,pathlib,os; p=pathlib.Path("dist")/os.environ["BINARY_NAME"]; (p.parent/"SHA256SUMS").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")'
          tar -czf "dist/${BINARY_NAME%.exe}.tar.gz" -C dist "$BINARY_NAME" README.md README.en.md THIRD_PARTY_NOTICES.txt SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
