[package]
name = "allfiles-rust-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Read-only AllFiles search microbenchmark, not a replacement application"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
